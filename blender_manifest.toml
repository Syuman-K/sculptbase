schema_version = "1.0.0"

id = "sculptbase"
version = "0.1.0"
name = "SculptBase"
tagline = "Retopo split parts into multires sculpt bases with joint guards"
maintainer = "GarageKit <zhuwanchuanyuan@gmail.com>"
type = "add-on"

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
tags = ["Mesh", "Sculpt"]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".git/",
  ".github/",
  "*.zip",
  "*.blend",
  "*.blend1",
  ".gitignore",
  "dist/",
  "_test/",
  "README.md",
]
